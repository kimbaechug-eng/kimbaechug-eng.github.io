<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>배추 아케이드 - 무료 웹게임 포털</title>
  <meta name="google-site-verification" content="tHlIyu2g892W8H4R5U39QIUizbCYaDKkCoVK6bNwEsI" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; user-select: none; }
    body { background: linear-gradient(135deg, #090d16 0%, #1e1b4b 100%); color: #f8fafc; min-height: 100vh; overflow-x: hidden; }
    #lobby { display: flex; flex-direction: column; align-items: center; min-height: 100vh; }

    .card { background: rgba(30, 41, 59, 0.85); border: 2px solid #334155; border-radius: 18px; padding: 28px; transition: 0.25s; display: flex; flex-direction: column; justify-content: space-between; }

    .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; margin-bottom: 14px; width: fit-content; }
    .b-moba { background: #1d4ed8; color: #dbeafe; }
    .b-rpg { background: #ea580c; color: #ffedd5; }
    .card h2 { font-size: 1.5rem; margin-bottom: 10px; color: #fff; }
    .card p { color: #cbd5e1; font-size: 0.95rem; line-height: 1.5; margin-bottom: 24px; }
    .btn { display: block; width: 100%; border: none; cursor: pointer; text-align: center; background: #38bdf8; color: #090d16; font-weight: bold; padding: 14px; border-radius: 10px; font-size: 1.05rem; }
    .btn:hover { background: #7dd3fc; }
    #gameWrap { display: none; position: fixed; inset: 0; background: #000; z-index: 9999; }
    #backBtn { position: fixed; top: 12px; left: 12px; z-index: 10000; background: rgba(239,68,68,.9); color: #fff; border: 2px solid #fff; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body oncontextmenu="return false">
  <div id="lobby">
    <header>
      <h1>🎮 배추 아케이드 (BAECHU ARCADE)</h1>
      <p>차단 없이 사이트 안에서 0.1초 만에 바로 실행되는 무료 웹게임</p>
    </header>
    <main class="grid">
      <div class="card">
        <div><span class="badge b-moba">5:5 팀전 MOBA</span><h2>협곡 미니 대전 5:5</h2><p>이즈리얼, 아리, 티모 등 9종의 챔피언을 선택해 적 넥서스를 파괴하세요!</p></div>
        <button class="btn" onclick="launch(1)">▶ 지금 플레이하기</button>
      </div>
      <div class="card">
        <div><span class="badge b-rpg">2D 횡스크롤 RPG</span><h2>메이플 미니 월드</h2><p>전사·마법사·궁수로 전직해 슬라임과 머쉬맘을 사냥하고 무기를 강화하세요!</p></div>
        <button class="btn" onclick="launch(2)">▶ 지금 플레이하기</button>
      </div>
    </main>
  </div>
  <div id="gameWrap">
    <button id="backBtn" onclick="location.reload()">◀ 로비로</button>
    <canvas id="c" width="1280" height="720"></canvas>
  </div>
<script>
const c=document.getElementById("c"),x=c.getContext("2d"),VW=1280,VH=720,H=Math.hypot,A=Math.atan2,C=Math.cos,S=Math.sin;
const AC=new(window.AudioContext||window.webkitAudioContext)();
function sfx(f,t,d,v){try{if(AC.state==="suspended")AC.resume();let o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f*.35,AC.currentTime+d);g.gain.setValueAtTime(v||.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}
function launch(mode){
  document.getElementById("lobby").style.display="none";
  document.getElementById("gameWrap").style.display="block";
  if(mode===1)initLol();else initMaple();
}
function initLol(){
const MW=3e3,MH=3e3;
let st="SEL",win="",tk=0,mp={x:640,y:360},cam={x:0,y:MH-VH},lk=1,g=500,ab=0,lv=1,xp=0,kl=0,dt=0,qT=0,wT=0,eT=0,rT=0,aT=0,dT=0,fT=0,sp=0,ww=0,pyro=0,p,E=[],P=[],FX=[],SH=[];
const CH={c1:{n:"이즈리얼",h:550,s:4.8,a:42,g:240,c:"#facc15",c2:"#38bdf8",d:"Q화살 W회복 E비전 R궁"},c2:{n:"가렌",h:920,s:4.5,a:55,g:115,c:"#3b82f6",c2:"#fde047",d:"Q돌진 W회복 E회전 R심판"},c3:{n:"럭스",h:520,s:4.3,a:38,g:250,c:"#f472b6",c2:"#fef08a",d:"Q속박 W보호 E광역 R섬광"},c4:{n:"야스오",h:640,s:5.1,a:52,g:120,c:"#38bdf8",c2:"#e0f2fe",d:"Q폭풍 W장막 E질풍 R숨결"},c5:{n:"리신",h:740,s:5.0,a:54,g:120,c:"#fb923c",c2:"#ef4444",d:"Q음파 W방호 E폭풍 R분노"},c6:{n:"제드",h:590,s:5.2,a:58,g:125,c:"#ef4444",c2:"#1e1b4b",d:"Q표창 W그림자 E베기 R표식"},c7:{n:"애니",h:530,s:4.4,a:40,g:230,c:"#fb7185",c2:"#f97316",d:"Q붕괴 W소각 E방패 R티버"},c8:{n:"아리",h:560,s:4.9,a:44,g:235,c:"#ec4899",c2:"#f8fafc",d:"Q구슬 W회복 E매혹 R질주"},c9:{n:"티모",h:520,s:5.1,a:46,g:220,c:"#84cc16",c2:"#facc15",d:"Q실명 W질주 E맹독 R독버섯"}};
function addFx(x,y,cl,txt,sz){FX.push({x,y,vx:(Math.random()-.5)*4,vy:txt?-1.8:(Math.random()-.5)*4,cl,txt,sz:sz||4,t:txt?45:22,mt:txt?45:22});}
function gainXp(v){xp+=v;if(xp>=lv*100){xp-=lv*100;lv++;ab+=6;p.mhp+=65;p.hp=Math.min(p.mhp,p.hp+120);sfx(660,"triangle",.35,.15);addFx(p.x,p.y-40,"#38bdf8","LEVEL UP! Lv."+lv);}}
function start(id){st="PLAY";tk=0;g=500;ab=0;lv=1;xp=0;kl=0;dt=0;sp=0;ww=0;pyro=0;dT=0;fT=0;E=[];P=[];FX=[];SH=[];let ch=CH["c"+id];p={x:260,y:MH-260,hp:ch.h,mhp:ch.h,r:22,tm:1,tp:0,tx:260,ty:MH-260,id,s:ch.s,a:ch.a,g:ch.g,c:ch.c,c2:ch.c2,v:470,ang:-.7,ig:0,stn:0};E.push(p,{x:180,y:MH-180,hp:3200,mhp:3200,r:48,tm:1,tp:2,v:560},{x:MW-180,y:180,hp:3200,mhp:3200,r:48,tm:0,tp:2,v:560});[{tm:1,role:0,c:"#3b82f6",c2:"#fde047"},{tm:1,role:3,c:"#f97316",c2:"#ef4444"},{tm:1,role:2,c:"#facc15",c2:"#38bdf8"},{tm:1,role:2,c:"#f472b6",c2:"#fef08a"},{tm:0,role:0,c:"#dc2626",c2:"#450a0a"},{tm:0,role:3,c:"#991b1b",c2:"#1e1b4b"},{tm:0,role:1,c:"#b91c1c",c2:"#f97316"},{tm:0,role:2,c:"#e11d48",c2:"#fde047"},{tm:0,role:2,c:"#be123c",c2:"#a855f7"}].forEach((b,idx)=>E.push({x:b.tm?220+idx*20:MW-220-idx*15,y:b.tm?MH-220-idx*15:220+idx*15,hp:820,mhp:820,r:21,tm:b.tm,tp:4,role:b.role,c:b.c,c2:b.c2,v:450,ang:b.tm?-.7:2.4,ig:0,stn:0,resp:0}));for(let u of[{x:220,y:1400,t:1},{x:220,y:750,t:1},{x:850,y:220,t:0},{x:1500,y:220,t:0},{x:850,y:MH-850,t:1},{x:1200,y:MH-1200,t:1},{x:MW-1200,y:1200,t:0},{x:MW-850,y:850,t:0},{x:950,y:MH-220,t:1},{x:1650,y:MH-220,t:1},{x:MW-220,y:1600,t:0},{x:MW-220,y:900,t:0}])E.push({x:u.x,y:u.y,hp:1500,mhp:1500,r:32,tm:u.t,tp:1,v:430,tg:null});spJ();}
function spJ(){for(let m of[{x:750,y:1350,h:400,r:20,g:130,c:"#d97706"},{x:1150,y:1950,h:450,r:22,g:150,c:"#b45309"},{x:1750,y:2250,h:400,r:20,g:130,c:"#d97706"},{x:MW-750,y:MW-1350,h:400,r:20,g:130,c:"#92400e"},{x:MW-1150,y:MW-1950,h:450,r:22,g:150,c:"#78350f"},{x:1950,y:1950,h:900,r:34,g:350,c:"#f97316"},{x:1050,y:1050,h:1200,r:38,g:500,c:"#a855f7"}])if(!E.some(e=>e.tp===5&&H(e.x-m.x,e.y-m.y)<40))E.push({x:m.x,y:m.y,hp:m.h,mhp:m.h,r:m.r,tm:2,tp:5,g:m.g,c:m.c,v:0,ig:0,stn:0});}
function castSkill(k){
  if(st==="SEL"){if(k>="1"&&k<="9")start(+k);return;}if(st==="OVER"){if(k===" ")st="SEL";return;}
  if(k==="y")lk=!lk;if(k===" "){cam.x=p.x-VW/2;cam.y=p.y-VH/2;}
  let n=Date.now(),wx=mp.x+cam.x,wy=mp.y+cam.y,a=A(wy-p.y,wx-p.x);p.ang=a;
  if(k==="b"&&g>=300){g-=300;ab+=15;p.mhp+=110;p.hp+=110;sfx(580,"sine",.2,.1);addFx(p.x,p.y-25,"#facc15","강화 +15ATK");}
  if(k==="d"&&n-dT>=15e3){let d=Math.min(240,H(wx-p.x,wy-p.y));p.x=p.tx=Math.max(40,Math.min(MW-40,p.x+C(a)*d));p.y=p.ty=Math.max(40,Math.min(MH-40,p.y+S(a)*d));sfx(780,"sine",.18,.12);addFx(p.x,p.y-25,"#fde047","점멸!");dT=n;}
  if(k==="f"&&n-fT>=12e3){let tg=E.find(u=>u.tm!==1&&u.hp>0&&(u.tp===4||u.tp===5)&&H(u.x-wx,u.y-wy)<80&&H(u.x-p.x,u.y-p.y)<380);if(tg){tg.ig=240;sfx(320,"sawtooth",.25,.1);addFx(tg.x,tg.y-25,"#f97316","점화!");fT=n;}}
  if(k==="q"&&n-qT>=1900){sfx(480,"triangle",.15,.09);let stn=p.id===7&&++pyro>=4?1:0;if(stn)pyro=0;if(p.id===2){p.x=p.tx+=C(a)*105;p.y=p.ty+=S(a)*105;fire(p,wx,wy,15,100+ab,20,"#facc15",1,0,0);}else if(p.id===6){fire(p,wx,wy,21,65+ab*.7,11,"#ef4444",1,0,0);fire(p,wx+45,wy-45,21,55+ab*.6,10,"#b91c1c",1,0,0);}else fire(p,wx,wy,p.id===4||p.id===8?20:18,(p.id===5?95:p.id===4?90:85)+ab,p.id===4?14:13,p.id===9?"#84cc16":p.id===8?"#ec4899":p.id===7?"#f97316":p.id===4?"#38bdf8":p.id===5?"#fb923c":p.id===1?"#fde047":"#f472b6",1,p.id===8?1:0,stn);qT=n;}
  if(k==="w"&&n-wT>=4500){sfx(520,"sine",.2,.09);if(p.id===7){let stn=++pyro>=4?1:0;if(stn)pyro=0;for(let en of E)if(en.tm!==1&&en.hp>0&&H(en.x-(p.x+C(a)*90),en.y-(p.y+S(a)*90))<130){en.hp-=105+ab;if(stn)en.stn=90;addFx(en.x,en.y-15,"#fb923c",stn?"기절!":"-"+Math.round(105+ab));}}else if(p.id===4)ww=180;else if(p.id===6){p.x=p.tx+=C(a)*210;p.y=p.ty+=S(a)*210;}else if(p.id===9){sp=110;addFx(p.x,p.y-20,"#84cc16","신속한 이동!");}else{p.hp=Math.min(p.mhp,p.hp+160);addFx(p.x,p.y-20,"#4ade80","+160");}wT=n;}
  if(k==="e"&&n-eT>=3200){sfx(400,"square",.15,.08);if(p.id===7){pyro++;p.hp=Math.min(p.mhp,p.hp+140);sp=40;addFx(p.x,p.y-20,"#fb923c","용암방패!");}else if(p.id===1||p.id===4){let d=p.id===1?185:160;p.x=p.tx+=C(a)*d;p.y=p.ty+=S(a)*d;}else if(p.id===2)sp=90;else if(p.id===8)fire(p,wx,wy,16,80+ab,15,"#f472b6",1,0,1);else if(p.id===5||p.id===6){for(let en of E)if(en.tm!==1&&en.hp>0&&H(en.x-p.x,en.y-p.y)<140){en.hp-=95+ab;addFx(en.x,en.y-15,"#fb923c","-"+Math.round(95+ab));}sp=20;}else fire(p,wx,wy,13,115+ab,26,p.id===9?"#a3e635":"#fbcfe8",1,0,0);eT=n;}
  if(k==="r"&&n-rT>=11e3){sfx(260,"sawtooth",.35,.12);if(p.id===9){SH.push({x:p.x,y:p.y,life:1800});addFx(p.x,p.y-25,"#84cc16","독버섯 설치!");rT=n;return;}if(p.id===7){let stn=++pyro>=4?1:0;if(stn)pyro=0;E=E.filter(e=>e.tp!==6);let tx=Math.max(60,Math.min(MW-60,p.x+C(a)*Math.min(360,H(wx-p.x,wy-p.y)))),ty=Math.max(60,Math.min(MH-60,p.y+S(a)*Math.min(360,H(wx-p.x,wy-p.y))));E.push({x:tx,y:ty,hp:950+ab*6,mhp:950+ab*6,r:30,tm:1,tp:6,v:360,life:900,ang:a});for(let en of E)if(en.tm!==1&&en.hp>0&&H(en.x-tx,en.y-ty)<150){en.hp-=140+ab*1.1;if(stn)en.stn=90;addFx(en.x,en.y-20,"#f97316",stn?"티버 기절!":"-"+Math.round(140+ab*1.1));}addFx(tx,ty-35,"#fde047","소환: 티버!");rT=n;return;}if(p.id===4||p.id===6||p.id===8){p.x=p.tx+=C(a)*210;p.y=p.ty+=S(a)*210;if(p.id===6||p.id===8){for(let en of E)if(en.tm!==1&&en.hp>0&&H(en.x-p.x,en.y-p.y)<165){en.hp-=145+ab*1.1;addFx(en.x,en.y-20,p.c,"-"+Math.round(145+ab*1.1));}sp=25;rT=n;return;}}fire(p,wx,wy,19,135+ab*1.1,26,p.id===4?"#38bdf8":p.id===2?"#facc15":p.id===5?"#f97316":"#e879f9",1,1,0);rT=n;}
}
c.onmousemove=e=>{let r=c.getBoundingClientRect();mp={x:(e.clientX-r.left)/r.width*VW,y:(e.clientY-r.top)/r.height*VH};};
c.onmousedown=e=>{if(st==="SEL"){start(Math.min(9,Math.max(1,Math.floor((mp.x-14)/140)+1)));return;}if(st!=="PLAY")return;if(mp.x>VW-220&&mp.y>VH-220){p.tx=(mp.x-VW+210)/200*MW;p.ty=(mp.y-VH+210)/200*MH;return;}let wx=mp.x+cam.x,wy=mp.y+cam.y;p.tx=wx;p.ty=wy;p.ang=A(wy-p.y,wx-p.x);for(let en of E)if(en.tm!==1&&en.hp>0&&H(en.x-wx,en.y-wy)<=en.r+16&&H(en.x-p.x,en.y-p.y)<=p.g){if(Date.now()-aT>=680){fire(p,en.x,en.y,14,p.a+ab,7,"#fef08a",1,0,0);aT=Date.now();}break;}};
window.onkeydown=e=>castSkill(e.key.toLowerCase());
function fire(s,tx,ty,sp,d,r,cl,tm,pc,stn){let a=A(ty-s.y,tx-s.x);P.push({x:s.x,y:s.y,vx:C(a)*sp,vy:S(a)*sp,d,r,cl,tm,pc,stn});}
function wp(m){return m.ln===0?(m.tm===1?(m.y>260?{x:220,y:220}:{x:MW-180,y:180}):(m.x>260?{x:220,y:220}:{x:180,y:MH-180})):m.ln===2?(m.tm===1?(m.x<MW-260?{x:MW-220,y:MH-220}:{x:MW-180,y:180}):(m.y<MH-260?{x:MW-220,y:MH-220}:{x:180,y:MH-180})):(m.tm===1?{x:MW-180,y:180}:{x:180,y:MH-180});}

function update(){tk++;if(p.cd>0)p.cd--;if(p.inv>0)p.inv--;if(tk%120===0)p.mp=Math.min(p.mmp,p.mp+4);if(keys["arrowleft"]){p.vx=-4.8;p.dir=-1;}else if(keys["arrowright"]){p.vx=4.8;p.dir=1;}else p.vx*=0.75;let pyPrev=p.y+p.h/2;p.vy+=GR;p.x=Math.max(25,Math.min(MW-25,p.x+p.vx));p.y+=p.vy;if(p.vy>=0)for(let pl of PLATS)if(p.x>pl.x-15&&p.x<pl.x+pl.w+15&&pyPrev<=pl.y+8&&p.y+p.h/2>=pl.y){p.y=pl.y-p.h/2;p.vy=0;p.jmp=0;break;}camX=Math.max(0,Math.min(MW-VW,p.x-VW/2));for(let i=P.length-1;i>=0;i--){let pr=P[i];if(pr.vx){pr.x+=pr.vx;pr.y+=pr.vy;}if(--pr.life<=0){P.splice(i,1);continue;}for(let m of M){if(m.hp<=0||pr.hit.includes(m))continue;let hit=pr.tp===0?(Math.abs(m.x-pr.x)<(m.w+pr.w)/2&&Math.abs(m.y-pr.y)<(m.h+pr.h)/2):(Math.abs(m.x-pr.x)<m.w/2+pr.r&&Math.abs(m.y-pr.y)<m.h/2+pr.r);if(hit){let crit=Math.random()<0.25,dmg=Math.round(pr.d*(crit?1.5:1));m.hp-=dmg;m.vx=pr.dir*(m.tp===2?1.5:5.5);m.vy=-3;pr.hit.push(m);dmgFx(m.x,m.y-m.h/2,dmg,crit);if(m.hp<=0){gainXp(m.xp);D.push({tp:0,x:m.x,y:m.y,vy:-5,v:m.ms,life:900});if(Math.random()<0.35)D.push({tp:Math.random()<0.6?1:2,x:m.x+16,y:m.y,vy:-6,v:1,life:900});let dtp=m.tp;setTimeout(()=>spawnMob(dtp),dtp===2?12000:3500);}if(pr.tp!==0){P.splice(i,1);break;}}}}M=M.filter(m=>m.hp>0);for(let m of M){if(tk%70===0&&Math.random()<0.6)m.dir=Math.random()<0.5?-1:1;if(m.tp===2&&tk%90===0){m.dir=p.x>m.x?1:-1;m.vy=-11;}m.vx+=(m.dir*(m.tp===2?2.4:1.5)-m.vx)*0.15;let myPrev=m.y+m.h/2;m.vy+=GR;m.x=Math.max(40,Math.min(MW-40,m.x+m.vx));m.y+=m.vy;if(m.vy>=0)for(let pl of PLATS)if(m.x>pl.x&&m.x<pl.x+pl.w&&myPrev<=pl.y+8&&m.y+m.h/2>=pl.y){m.y=pl.y-m.h/2;m.vy=0;break;}if(p.inv<=0&&Math.abs(p.x-m.x)<(p.w+m.w)/2-6&&Math.abs(p.y-m.y)<(p.h+m.h)/2-6){p.hp-=m.atk;p.inv=55;p.vy=-6;dmgFx(p.x,p.y-30,"-"+m.atk,1);if(p.hp<=0)st="OVER";}}for(let i=D.length-1;i>=0;i--){let d=D[i];if(--d.life<=0){D.splice(i,1);continue;}let dyPrev=d.y+10;d.vy+=GR;d.y+=d.vy;for(let pl of PLATS)if(d.vy>=0&&d.x>pl.x&&d.x<pl.x+pl.w&&dyPrev<=pl.y+6&&d.y+10>=pl.y){d.y=pl.y-10;d.vy=0;break;}}for(let i=FX.length-1;i>=0;i--){FX[i].y+=FX[i].vy;if(--FX[i].t<=0)FX.splice(i,1);}}
function loop(){requestAnimationFrame(loop);if(st==="SEL"){x.fillStyle="#7dd3fc";x.fillRect(0,0,VW,VH);x.fillStyle="#1e293b";x.font="bold 38px sans-serif";x.fillText("메이플 미니 월드 - 직업을 선택하세요 (클릭 또는 1~3)",210,120);const cards=[{t:"1. 전사",d:"높은 체력 / 근접 베기",c:"#ef4444"},{t:"2. 마법사",d:"강력한 원거리 마법",c:"#3b82f6"},{t:"3. 궁수",d:"빠른 연사 다중 화살",c:"#22c55e"}];for(let i=0;i<3;i++){let bx=150+i*340;x.fillStyle="#fff";x.fillRect(bx,190,300,360);x.strokeStyle=cards[i].c;x.lineWidth=5;x.strokeRect(bx,190,300,360);x.fillStyle=cards[i].c;x.beginPath();x.arc(bx+150,300,45,0,7);x.fill();x.fillStyle="#0f172a";x.font="bold 24px sans-serif";x.fillText(cards[i].t,bx+95,405);x.font="15px sans-serif";x.fillText(cards[i].d,bx+65,450);}return;}if(st==="PLAY")update();x.fillStyle="#bae6fd";x.fillRect(0,0,VW,VH);x.save();x.translate(-camX,0);for(let pl of PLATS){x.fillStyle="#92400e";x.fillRect(pl.x,pl.y,pl.w,pl.h);x.fillStyle="#65a30d";x.fillRect(pl.x,pl.y,pl.w,10);}for(let d of D){x.fillStyle=d.tp===0?"#facc15":d.tp===1?"#ef4444":"#3b82f6";x.beginPath();x.arc(d.x,d.y,9,0,7);x.fill();}for(let m of M){x.fillStyle=m.cl;x.fillRect(m.x-m.w/2,m.y-m.h/2,m.w,m.h);x.fillStyle="#ef4444";x.fillRect(m.x-m.w/2,m.y-m.h/2-14,m.w*(m.hp/m.mhp),6);x.fillStyle="#000";x.font="bold 11px sans-serif";x.fillText(m.n,m.x-m.w/2,m.y+m.h/2+14);}if(p.inv%6<4){x.fillStyle=p.cl;x.fillRect(p.x-p.w/2,p.y-p.h/2,p.w,p.h);x.fillStyle="#fde68a";x.beginPath();x.arc(p.x,p.y-14,13,0,7);x.fill();}for(let pr of P){x.fillStyle=pr.cl;if(pr.tp===0)x.fillRect(pr.x-pr.w/2,pr.y-pr.h/2,pr.w,pr.h);else{x.beginPath();x.arc(pr.x,pr.y,pr.r,0,7);x.fill();}}for(let f of FX){x.fillStyle="#f97316";x.font="bold 20px sans-serif";x.fillText(f.v,f.x-15,f.y);}x.restore();x.fillStyle="rgba(15,23,42,.9)";x.fillRect(0,VH-68,VW,68);x.fillStyle="#fff";x.font="bold 15px sans-serif";x.fillText("Lv."+p.lv+" "+p.jn+" (+"+p.enh+"강)",20,VH-38);x.fillStyle="#ef4444";x.fillRect(210,VH-52,180*Math.max(0,p.hp/p.mhp),16);x.fillStyle="#3b82f6";x.fillRect(405,VH-52,180*Math.max(0,p.mp/p.mmp),16);x.fillStyle="#facc15";x.fillText("메소:"+p.meso+" | 포션:"+p.hpPot+"/"+p.mpPot+" | [Z]줍기 [X]기본 [A]스킬 [C]점프",605,VH-32);x.fillStyle="#38bdf8";x.fillRect(1070,VH-54,180,40);x.fillStyle="#0f172a";x.font="bold 16px sans-serif";x.fillText("[B] 상점 열기",1108,VH-28);if(shop){x.fillStyle="rgba(15,23,42,.95)";x.fillRect(420,160,440,320);x.strokeStyle="#facc15";x.lineWidth=3;x.strokeRect(420,160,440,320);x.fillStyle="#facc15";x.font="bold 22px sans-serif";x.fillText("헤네시스 상점 (클릭 또는 1~3)",475,210);x.fillStyle="#1e293b";x.fillRect(440,245,400,45);x.fillRect(440,300,400,45);x.fillRect(440,355,400,45);x.fillStyle="#fff";x.font="16px sans-serif";x.fillText(" 빨간포션 3개 구매 (50메소)",460,273);x.fillText(" 파란포션 3개 구매 (50메소)",460,328);x.fillText(" 무기강화 +12ATK (150메소)",460,383);x.fillStyle="#94a3b8";x.font="13px sans-serif";x.fillText("바깥쪽 클릭 또는 [B] 키로 닫기",545,445);}if(st==="OVER"){x.fillStyle="rgba(0,0,0,.8)";x.fillRect(0,0,VW,VH);x.fillStyle="#ef4444";x.font="bold 48px sans-serif";x.fillText("GAME OVER ([R] 재시작)",410,340);}}loop();
}
