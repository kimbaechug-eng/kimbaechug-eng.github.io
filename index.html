<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"><title>배추 아케이드 - 무료 웹게임 포털</title><meta name="description" content="설치 없이 바로 즐기는 무료 웹게임 천국! 협곡 미니 대전 5:5, 메이플 미니 월드, 네온 지오메트리 대시를 지금 플레이하세요."><style>*{margin:0;padding:0;box-sizing:border-box;font-family:'Malgun Gothic',sans-serif;user-select:none}body{background:linear-gradient(135deg,#090d16 0%,#1e1b4b 100%);color:#f8fafc;min-height:100vh;overflow-x:hidden}#lobby{display:flex;flex-direction:column;align-items:center;min-height:100vh}header{text-align:center;padding:50px 20px 30px}header h1{font-size:2.5rem;color:#38bdf8;text-shadow:0 0 20px rgba(56,189,248,.5);margin-bottom:10px}header p{color:#94a3b8;font-size:1.05rem}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:24px;width:100%;max-width:1060px;padding:20px}.card{background:rgba(30,41,59,.85);border:2px solid #334155;border-radius:18px;padding:26px;transition:.25s;display:flex;flex-direction:column;justify-content:space-between}.card:hover{transform:translateY(-8px);border-color:#38bdf8;box-shadow:0 12px 30px rgba(56,189,248,.25)}.badge{display:inline-block;padding:4px 12px;border-radius:20px;font-size:.8rem;font-weight:bold;margin-bottom:14px;width:fit-content}.b-moba{background:#1d4ed8;color:#dbeafe}.b-rpg{background:#ea580c;color:#ffedd5}.b-dash{background:#059669;color:#d1fae5}.card h2{font-size:1.45rem;margin-bottom:10px;color:#fff}.card p{color:#cbd5e1;font-size:.95rem;line-height:1.5;margin-bottom:22px}.btn{display:block;width:100%;border:none;cursor:pointer;text-align:center;background:#38bdf8;color:#090d16;font-weight:bold;padding:14px;border-radius:10px;font-size:1.05rem}.btn:hover{background:#7dd3fc}#gameWrap{display:none;position:fixed;inset:0;background:#000;z-index:9999}#backBtn{position:fixed;top:12px;left:12px;z-index:10000;background:rgba(239,68,68,.9);color:#fff;border:2px solid #fff;padding:8px 14px;border-radius:8px;font-weight:bold;cursor:pointer}canvas{display:block;width:100vw;height:100vh}</style></head><body oncontextmenu="return false"><div id="lobby"><header><h1>🎮 배추 아케이드 (BAECHU ARCADE)</h1><p>다운로드 없이 사이트 안에서 0.1초 만에 바로 실행되는 무료 웹게임</p></header><main class="grid"><div class="card"><div><span class="badge b-moba">5:5 팀전 MOBA</span><h2>협곡 미니 대전 5:5</h2><p>이즈리얼, 아리, 티모 등 9종의 챔피언을 선택해 적 넥서스를 파괴하세요!</p></div><button class="btn" onclick="launch(1)">▶ 지금 플레이하기</button></div><div class="card"><div><span class="badge b-rpg">2D 횡스크롤 RPG</span><h2>메이플 미니 월드</h2><p>전사·마법사·궁수로 전직해 3개 구역을 탐험하고 머쉬맘을 사냥하세요!</p></div><button class="btn" onclick="launch(2)">▶ 지금 플레이하기</button></div><div class="card"><div><span class="badge b-dash">리듬 점프 액션</span><h2>네온 지오메트리 대시</h2><p>리듬 비트에 맞춰 가시와 절벽을 뛰어넘어 100% 완주에 도전하세요!</p></div><button class="btn" onclick="launch(3)">▶ 지금 플레이하기</button></div></main></div><div id="gameWrap"><button id="backBtn" onclick="location.reload()">◀ 로비로</button><canvas id="c" width="1280" height="720"></canvas></div><script>const c=document.getElementById("c"),x=c.getContext("2d"),VW=1280,VH=720,H=Math.hypot,A=Math.atan2,C=Math.cos,S=Math.sin,AC=new(window.AudioContext||window.webkitAudioContext)();function sfx(f,t,d,v){try{if(AC.state==="suspended")AC.resume();let o=AC.createOscillator(),g=AC.createGain();o.type=t||"sine";o.frequency.setValueAtTime(f,AC.currentTime);o.frequency.exponentialRampToValueAtTime(f*.35,AC.currentTime+d);g.gain.setValueAtTime(v||.07,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d);}catch(e){}}function launch(m){document.getElementById("lobby").style.display="none";document.getElementById("gameWrap").style.display="block";if(m===1)initLol();else if(m===2)initMaple();else initDash();}
function initDash(){const GND=560,GOAL=13500,SPD=9.5;let st="PLAY",tk=0,att=1,hold=0,camX=0,p,OBS=[],PTS=[];const NOTES=[130,164,196,261,196,164,220,261,329,261,220,196,146,174,220,293];function build(){OBS=[];for(let i=0;i<16;i++){let bx=900+i*760;if(i%4===0){OBS.push({tp:0,x:bx,y:GND,w:42,h:44});OBS.push({tp:0,x:bx+44,y:GND,w:42,h:44});OBS.push({tp:1,x:bx+290,y:GND-55,w:180,h:55});OBS.push({tp:0,x:bx+360,y:GND-55,w:40,h:42});}else if(i%4===1){OBS.push({tp:1,x:bx,y:GND-60,w:150,h:60});OBS.push({tp:1,x:bx+240,y:GND-130,w:160,h:130});OBS.push({tp:0,x:bx+450,y:GND,w:42,h:44});OBS.push({tp:0,x:bx+494,y:GND,w:42,h:44});}else if(i%4===2){OBS.push({tp:0,x:bx,y:GND,w:42,h:44});OBS.push({tp:2,x:bx+140,y:GND-95,r:22});OBS.push({tp:0,x:bx+220,y:GND,w:44,h:44});OBS.push({tp:0,x:bx+266,y:GND,w:44,h:44});OBS.push({tp:1,x:bx+360,y:GND-90,w:200,h:90});}else{OBS.push({tp:0,x:bx,y:GND,w:42,h:44});OBS.push({tp:0,x:bx+44,y:GND,w:42,h:44});OBS.push({tp:0,x:bx+88,y:GND,w:42,h:44});OBS.push({tp:1,x:bx+280,y:GND-75,w:170,h:75});OBS.push({tp:2,x:bx+510,y:GND-150,r:22});}}}function reset(){st="PLAY";tk=0;PTS=[];p={x:220,y:GND-44,vy:0,sz:44,ang:0,gnd:1};build();}reset();function jump(orb){if(orb){for(let o of OBS)if(o.tp===2&&!o.used&&H((p.x+22)-o.x,(p.y+22)-o.y)<58){o.used=1;p.vy=-16.5;p.gnd=0;sfx(780,"triangle",.15,.1);for(let k=0;k<12;k++)PTS.push({x:o.x,y:o.y,vx:(Math.random()-.5)*8,vy:(Math.random()-.5)*8,cl:"#facc15",t:22});return;}}if(p.gnd){p.vy=-15.2;p.gnd=0;sfx(520,"square",.1,.07);}}window.onkeydown=e=>{if(e.code==="Space"||e.key==="ArrowUp"||e.key.toLowerCase()==="w"||e.key==="ㅈ"){e.preventDefault();if(!hold)jump(1);hold=1;if(st!=="PLAY"){att++;reset();}}};window.onkeyup=e=>{if(e.code==="Space"||e.key==="ArrowUp"||e.key.toLowerCase()==="w"||e.key==="ㅈ")hold=0;};c.onmousedown=()=>{if(st!=="PLAY"){att++;reset();return;}jump(1);hold=1;};c.onmouseup=()=>hold=0;c.ontouchstart=e=>{e.preventDefault();if(st!=="PLAY"){att++;reset();return;}jump(1);hold=1;};c.ontouchend=()=>hold=0;function die(){st="DEAD";sfx(140,"sawtooth",.4,.15);for(let i=0;i<26;i++)PTS.push({x:p.x+22,y:p.y+22,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14,cl:"#38bdf8",t:35});setTimeout(()=>{if(st==="DEAD"){att++;reset();}},750);}function update(){tk++;if(tk%16===0)sfx(NOTES[(tk/16)%NOTES.length],"triangle",.18,.04);if(hold&&p.gnd)jump(0);let pyPrev=p.y+p.sz;p.x+=SPD;p.vy+=0.88;p.y+=p.vy;p.gnd=0;if(p.y+p.sz>=GND){p.y=GND-p.sz;p.vy=0;p.gnd=1;}for(let o of OBS){if(o.tp===1){if(p.x+p.sz>o.x+4&&p.x<o.x+o.w-4){if(pyPrev<=o.y+12&&p.y+p.sz>=o.y){p.y=o.y-p.sz;p.vy=0;p.gnd=1;}else if(p.y+p.sz>o.y+10&&p.y<o.y+o.h){die();return;}}}else if(o.tp===0){let sx=o.x+o.w/2,sy=o.y-o.h*0.55;if(H((p.x+22)-sx,(p.y+22)-sy)<27){die();return;}}}if(p.gnd){p.ang=Math.round(p.ang/(Math.PI/2))*(Math.PI/2);if(tk%3===0)PTS.push({x:p.x,y:p.y+p.sz-4,vx:-3,vy:(Math.random()-.5)*2,cl:"#22d3ee",t:16});}else p.ang+=0.14;if(p.x>=GOAL){st="WIN";sfx(880,"triangle",.5,.15);}camX=p.x-240;for(let i=PTS.length-1;i>=0;i--){PTS[i].x+=PTS[i].vx;PTS[i].y+=PTS[i].vy;if(--PTS[i].t<=0)PTS.splice(i,1);}}function loop(){requestAnimationFrame(loop);if(st==="PLAY")update();let pct=Math.min(100,Math.floor(p.x/GOAL*100));let bg=x.createLinearGradient(0,0,0,VH);if(pct<35){bg.addColorStop(0,"#090d16");bg.addColorStop(1,"#1e1b4b");}else if(pct<70){bg.addColorStop(0,"#1e1b4b");bg.addColorStop(1,"#4c0519");}else{bg.addColorStop(0,"#064e3b");bg.addColorStop(1,"#090d16");}x.fillStyle=bg;x.fillRect(0,0,VW,VH);x.strokeStyle="rgba(56,189,248,.08)";x.lineWidth=2;let gx=-(camX*0.5)%80;for(let i=gx;i<VW;i+=80){x.beginPath();x.moveTo(i,0);x.lineTo(i,GND);x.stroke();}x.fillStyle="#0f172a";x.fillRect(0,GND,VW,VH-GND);x.strokeStyle="#38bdf8";x.lineWidth=4;x.beginPath();x.moveTo(0,GND);x.lineTo(VW,GND);x.stroke();x.save();x.translate(-camX,0);x.fillStyle="rgba(56,189,248,.18)";x.font="bold 42px sans-serif";x.fillText("ATTEMPT "+att,260,340);x.fillStyle="#22c55e";x.fillRect(GOAL,180,20,GND-180);x.fillText("GOAL!",GOAL-40,160);for(let o of OBS){if(o.x<camX-100||o.x>camX+VW+100)continue;if(o.tp===0){x.fillStyle="#f43f5e";x.strokeStyle="#fff";x.lineWidth=2;x.beginPath();x.moveTo(o.x,o.y);x.lineTo(o.x+o.w/2,o.y-o.h);x.lineTo(o.x+o.w,o.y);x.closePath();x.fill();x.stroke();}else if(o.tp===1){x.fillStyle="#1e293b";x.fillRect(o.x,o.y,o.w,o.h);x.strokeStyle="#38bdf8";x.lineWidth=3;x.strokeRect(o.x,o.y,o.w,o.h);}else{x.strokeStyle="#facc15";x.lineWidth=4;x.beginPath();x.arc(o.x,o.y,o.r,0,7);x.stroke();x.fillStyle="rgba(250,204,21,.3)";x.fill();}}for(let pt of PTS){x.fillStyle=pt.cl;x.fillRect(pt.x,pt.y,6,6);}if(st!=="DEAD"){x.save();x.translate(p.x+p.sz/2,p.y+p.sz/2);x.rotate(p.ang);x.fillStyle="#38bdf8";x.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz);x.strokeStyle="#fff";x.lineWidth=3;x.strokeRect(-p.sz/2,-p.sz/2,p.sz,p.sz);x.fillStyle="#0f172a";x.fillRect(-10,-10,7,7);x.fillRect(5,-10,7,7);x.fillRect(-10,4,22,6);x.restore();}x.restore();x.fillStyle="#1e293b";x.fillRect(VW/2-220,22,440,16);x.fillStyle="#22c55e";x.fillRect(VW/2-220,22,440*(pct/100),16);x.strokeStyle="#fff";x.lineWidth=1.5;x.strokeRect(VW/2-220,22,440,16);x.fillStyle="#fff";x.font="bold 14px sans-serif";x.fillText(pct+"%",VW/2+232,35);if(st==="WIN"){x.fillStyle="rgba(0,0,0,.78)";x.fillRect(0,0,VW,VH);x.fillStyle="#22c55e";x.font="bold 54px sans-serif";x.fillText("STAGE CLEAR! (시도: "+att+"회)",360,330);x.fillStyle="#fff";x.font="22px sans-serif";x.fillText("클릭 또는 SPACE로 다시 도전",500,395);}}loop();}
